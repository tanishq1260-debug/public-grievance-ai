<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Public Grievance AI Assistant{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">GrievanceAI</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/submit">Submit Complaint</a></li>
                <li><a href="/track">Track Status</a></li>
                <li><a href="/admin">Admin Dashboard</a></li>
            </ul>
        </div>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2024 Public Grievance AI Assistant. Built for citizen engagement.</p>
        </div>
    </footer>
    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
